<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>list and tables</title>
</head>
<body>
    <!-- lists -->
    <ul type="circle">
        <li>Milk</li>
        <li>Jam</li>
        <li>Bread</li>
        <li>Maggi</li>
    </ul>
    <ol type="A">
        <li>Milk</li>
        <ul>
            <li>cream</li>
            <li>full cream</li>
        </ul>
        <li>Jam</li>
        <li>Bread</li>
        <li>Maggi</li>
    </ol>
    <!-- tables -->
     <table border="1">
        <thead>
            <tr>
            <th colspan="2">Name</th>
            <th>Roll No.</th>
            <th>Grade</th>
        </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">Jack</td>
                <td>1</td>
                <td>A+</td>
            </tr>
            <tr>
                <td>Oggy</td>
                <td>2</td>
                <td>A++</td>
            </tr>
            <tr>
                <td>Olly</td>
                <td>3</td>
                <td>A+++</td>
            </tr>
        </tbody>
     </table>
</body>
</html>
